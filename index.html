*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fcfbf9}
main{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:linear-gradient(95deg,#fcfbf9,#fcfbf9 74%)}
/* The image and simulation canvas use exactly the same image-space coordinates. */
.hourglass{position:absolute;top:50%;left:0;height:100dvh;aspect-ratio:1672/941;transform:translateY(-50%);pointer-events:none;user-select:none;}
.hourglass img,.hourglass canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
.hourglass img{object-fit:fill;z-index:0}
/* Lossless, transparent wall-only overlay: original glass and sand image is unchanged. */
.hourglass .white-wall{z-index:1}
/* A restrained wall signature visually seen THROUGH the lower glass lens. */
.wall-signature{position:absolute;z-index:2;left:21.1%;top:68.5%;width:31%;
 text-align:center;white-space:nowrap;transform:translate(-50%,-50%);
 font-family:'Syncopate',sans-serif;font-size:.62rem;font-weight:700;
 letter-spacing:.45em;text-transform:uppercase;color:#C0A181;
 opacity:.48;mix-blend-mode:multiply;filter:blur(.22px);pointer-events:none;
 text-shadow:0 1px 1px rgba(255,250,242,.36)}
.hourglass canvas{z-index:3}
/* The inscription is fixed in glass-image coordinates on both layouts. */
/* A close-up architectural crop on narrow phones: the waist remains prominent at the left. */
@media(max-width:700px){.hourglass{left:-23dvh}.wall-signature{left:25.5%;transform:translate(-50%,-50%) scale(.75)}}
@media(max-width:440px){.hourglass{left:-26.5dvh}}
@media(prefers-reduced-motion:reduce){.hourglass canvas{opacity:.9}}

/* The Afterword Concierge wordmark. The existing glass, sand, and wall are not altered. */
.identity-section{
  position:absolute;z-index:5;left:55%;right:3.5%;top:50%;
  transform:translateY(-50%);color:#000;
  text-align:left;pointer-events:none;
}
.identity-inner{max-width:600px;margin-inline:auto;}
.software-name{
  position:relative;top:clamp(7px,.72vw,10px);
  margin:0 0 clamp(3px,.55vw,7px) .06em;
  color:#000;font:600 clamp(10px,.93vw,13px)/1.6 Arial,Helvetica,sans-serif;
  letter-spacing:.25em;text-transform:uppercase;
}
.primary-wordmark{margin:0;color:#000;font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(49px,5.05vw,82px);font-weight:500;line-height:.92;letter-spacing:-.047em;}
.primary-wordmark .wordline{display:block;white-space:nowrap;}
.primary-wordmark .wordline + .wordline{margin-top:.085em;}
/* A lowercase-t-sized Latin cross: aligned with the adjacent ascenders and baseline. */
.cross-letter{
  position:relative;display:inline-block;width:.36em;height:.76em;
  vertical-align:-.065em;margin-left:.015em;margin-right:.008em;
}
.cross-letter::before,.cross-letter::after{
  content:'';position:absolute;background:currentColor;border-radius:0;
}
.cross-letter::before{width:.043em;height:.76em;top:0;left:calc(50% - .0215em);}
.cross-letter::after{width:.34em;height:.043em;top:.255em;left:calc(50% - .17em);}
.service-name{
  margin:clamp(20px,3.6vw,42px) 0 0;
  color:#816F5C;font:500 clamp(10px,.91vw,12px)/1.9 Arial,Helvetica,sans-serif;
  letter-spacing:.24em;text-transform:uppercase;
}
.farewell-space{
  min-height:4.5em;margin-top:clamp(26px,4.5vw,55px);
  display:flex;align-items:flex-start;
}
.farewell-line{
  margin:0;color:#000;font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:400;font-size:clamp(23px,2.1vw,33px);line-height:1.35;
  letter-spacing:.005em;opacity:1;transition:opacity .7s ease;
}
.farewell-line.is-changing{opacity:0;}
/* Mobile is a single, full-viewport composition: sand + wording together. */
@media (max-width:900px){
  html,body{height:100%;overflow:hidden;}
  main{position:fixed;inset:0;overflow:hidden;}
  /* A light, transparent veil makes the writing readable over the glass;
     it preserves the neck and flowing sand at the left. */
  main::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
    background:linear-gradient(90deg,
      rgba(252,251,249,0) 18%,
      rgba(252,251,249,.12) 34%,
      rgba(252,251,249,.76) 48%,
      rgba(252,251,249,.97) 67%,
      #fcfbf9 100%);}
  .identity-section{position:absolute;top:51%;left:45%;right:4%;
    transform:translateY(-50%);z-index:5;margin:0;padding:0;
    background:transparent;min-height:0;max-height:100%;pointer-events:none;}
  .identity-inner{max-width:none;margin:0;}
  .software-name{top:0;font-size:10px;letter-spacing:.18em;
    margin:0 0 13px .03em;}
  .primary-wordmark{font-size:clamp(29px,4.7vw,49px);
    line-height:.98;letter-spacing:-.043em;}
  .service-name{font-size:10px;line-height:1.55;letter-spacing:.095em;
    margin-top:23px;}
  .farewell-space{margin-top:30px;min-height:6.5em;}
  .farewell-line{font-size:clamp(18px,3.1vw,26px);line-height:1.2;}
}
@media(max-width:700px){
  .identity-section{left:45%;right:4%;top:51%;}
  .primary-wordmark{font-size:clamp(28px,7.35vw,46px);}
  .farewell-line{font-size:clamp(18px,4.85vw,25px);}
}
@media(max-width:440px){
  .identity-section{left:44%;right:3.5%;top:51%;}
  .primary-wordmark{font-size:clamp(28px,7.45vw,36px);}
  .service-name{font-size:9.5px;letter-spacing:.06em;margin-top:20px;}
  .farewell-space{margin-top:23px;min-height:7.5em;}
}
@media(max-width:360px){
  .identity-section{left:44%;right:3%;}
  .primary-wordmark{font-size:clamp(25px,7.2vw,29px);}
  .service-name{font-size:9px;letter-spacing:.02em;}
  .farewell-line{font-size:18px;}
}
@media(max-height:650px) and (max-width:900px){
  .identity-section{top:49%;}
  .software-name{margin-bottom:8px;}
  .service-name{margin-top:13px;}
  .farewell-space{margin-top:16px;}
}
@media (prefers-reduced-motion:reduce){.farewell-line{transition:none;}}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;
 padding:0!important;margin:-1px!important;overflow:hidden!important;
 clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}

<script>
(()=>{
'use strict';
const canvas=document.getElementById('flow');
const ctx=canvas.getContext('2d',{alpha:true});
if(!ctx)return;
const W=1672,H=941,TAU=Math.PI*2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
// Fixed incoming and impact points correspond to the photographed waist and sand bed.
const inletY=319,impactY=794,neckX=350;
const grains=[];let previous=0,spawnRemainder=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function newGrain(initial=false){
  const y=initial?rand(inletY,impactY):inletY-rand(0,35);
  const t=Math.max(0,(y-inletY)/(impactY-inletY));
  return {y,x:neckX+rand(-2.5,2.5),vx:rand(-3,3),speed:rand(280,490),r:rand(.55,1.7),
          a:rand(.35,.94),light:Math.random()>.42,phase:rand(0,TAU),spread:t};
}
for(let i=0;i<310;i++)grains.push(newGrain(true));
function render(now){
  const dt=Math.min(.05,Math.max(0,(now-(previous||now))/1000));previous=now;
  ctx.clearRect(0,0,W,H);
  // Subtle moving density at the throat: a narrow flow, not an opaque painted line.
  const pulse=.56+.08*Math.sin(now*.0016);
  const g=ctx.createLinearGradient(0,inletY,0,impactY);
  g.addColorStop(0,'rgba(226,174,92,.14)');g.addColorStop(.35,'rgba(243,197,115,.20)');g.addColorStop(1,'rgba(228,182,109,.06)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(neckX-2.8,inletY);
  ctx.bezierCurveTo(neckX-2,460,neckX-3,630,neckX-7,impactY);
  ctx.lineTo(neckX+7,impactY);
  ctx.bezierCurveTo(neckX+3,620,neckX+2,460,neckX+2.8,inletY);
  ctx.closePath();ctx.globalAlpha=pulse;ctx.fill();ctx.globalAlpha=1;
  if(!reduce.matches){
    spawnRemainder+=dt*175;
    const n=Math.min(22,Math.floor(spawnRemainder));spawnRemainder-=n;
    for(let i=0;i<n;i++)grains.push(newGrain());
  }
  for(let i=grains.length-1;i>=0;i--){
    let p=grains[i];
    if(!reduce.matches){p.y+=p.speed*dt;p.x+=p.vx*dt+(Math.random()-.5)*dt*13;}
    const t=Math.max(0,Math.min(1,(p.y-inletY)/(impactY-inletY)));
    const allowable=2.4+15*t*t;
    p.x=Math.max(neckX-allowable,Math.min(neckX+allowable,p.x));
    if(p.y>impactY-6+4*Math.cos((p.x-neckX)*.065)){
      grains.splice(i,1);continue;
    }
    const glimmer=.83+.17*Math.sin(now*.004+p.phase);
    ctx.fillStyle=p.light?`rgba(255,225,161,${p.a*glimmer})`:`rgba(193,134,64,${p.a*glimmer})`;
    ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*.6,p.r*rand(.7,1.8),0,0,TAU);ctx.fill();
  }
  // Impact grains scattered immediately above the fixed sand mound.
  if(!reduce.matches){
    for(let i=0;i<25;i++){
      const x=neckX+Math.sin(i*38.17+now*.0012)*i*1.3;
      const y=impactY-4-Math.abs(Math.sin(i*16.19+now*.0028))*rand(0,7);
      ctx.fillStyle=`rgba(255,224,169,${.12+.32*Math.abs(Math.sin(i*2.3+now*.003))})`;
      ctx.fillRect(x,y,1.1,1.1);
    }
  }
  if(grains.length>550)grains.splice(0,grains.length-550);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
</script>

<script>
(() => {
  'use strict';
  // Approved 34-line sequence; the first two remain the opening lines.
  const farewellLines = [
    "This is the goodbye I planned myself.",
    "A farewell, written in advance.",
    "Welcome to my final gathering.",
    "Join me for one last celebration.",
    "Come celebrate the life I lived.",
    "You are invited to my farewell.",
    "Join us for my final send-off.",
    "One last gathering, one lifetime of stories.",
    "If you’re reading this, it means I’ve gone ahead.",
    "This is not goodbye. It’s one last gathering.",
    "Come remember me the way I lived.",
    "My last invitation is for you.",
    "When my time comes, I hope you’ll be there.",
    "One last invitation from me.",
    "Come say goodbye, your way.",
    "Join me for the final chapter.",
    "Come for the stories. Stay for the memories.",
    "A final hello before goodbye.",
    "Gather for the life, not the loss.",
    "Come celebrate what was.",
    "Meet me in the memories.",
    "One life. One farewell. One last room full of people I love.",
    "My story ends here. Yours with me does not.",
    "If this message reached you, you mattered to me.",
    "I wanted you here for one last moment.",
    "This is my farewell, and you are part of it.",
    "Come remember me loudly.",
    "Come remember me gently.",
    "No speeches required. Just come as you are.",
    "One final gathering for all the people who made my life mine.",
    "I saved you a place at my farewell.",
    "You’re invited to the end of my story.",
    "Consider this my final invitation.",
    "Come close the chapter with me."
];
  const text = document.getElementById('farewell-line');
  if (!text) return;
  // Always start at the approved first line, without skipping when the tab is hidden.
  let index = 0;
  text.textContent = farewellLines[index];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fadeMs = 700;
  let displayTimer = null;
  let fadeTimer = null;
  let inView = false;
  let active = false;

  function cancelTimers() {
    clearTimeout(displayTimer);
    clearTimeout(fadeTimer);
    text.classList.remove('is-changing');
  }
  function advance() {
    text.classList.add('is-changing');
    fadeTimer = setTimeout(() => {
      index = (index + 1) % farewellLines.length;
      text.textContent = farewellLines[index];
      text.classList.remove('is-changing');
      if (active) displayTimer = setTimeout(advance, index < 2 ? 15000 : 10000);
    }, fadeMs);
  }
  function setActive(value) {
    if (active === value) return;
    active = value;
    cancelTimers();
    if (active) displayTimer = setTimeout(advance, index < 2 ? 15000 : 10000);
  }
  // Start the rotation only while the writing is visible on the screen.
  // Pausing in hidden tabs prevents an unseen loop from skipping the opening messages.
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      inView = entries.some(entry => entry.isIntersecting);
      setActive(inView && !document.hidden);
    }, { threshold: 0.25 });
    observer.observe(text);
  } else {
    inView = true;
    setActive(!document.hidden);
  }
  document.addEventListener('visibilitychange', () => setActive(inView && !document.hidden));
})();
</script>
